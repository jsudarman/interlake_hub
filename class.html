<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Office — Saints Station</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ── Hero ── */
    .class-hero { background: var(--primary-dark); padding: 40px 0 44px; }
    .class-hero h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 700; margin-bottom: 4px; }
    .class-hero .grade-label { font-size: .78rem; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; opacity: .7; }

    /* ── Layout ── */
    .class-layout { padding: 40px 0 80px; display: flex; flex-direction: column; gap: 32px; }

    /* ── Officer grid ── */
    .class-officers-grid {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
      padding: 20px;
    }
    @media (max-width: 560px) { .class-officers-grid { grid-template-columns: repeat(3, 1fr); } }
    .asb-officer-spot { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 5px; }
    .asb-officer-photo {
      width: 100%; aspect-ratio: 1; border-radius: var(--radius-sm);
      background: var(--highlight); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; color: var(--text-muted);
    }
    .asb-officer-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .asb-officer-name { font-size: .72rem; font-weight: 700; color: var(--text); line-height: 1.25; }
    .asb-officer-role { font-size: .64rem; color: var(--text-muted); line-height: 1.25; }

    /* ── Section card ── */
    .section-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 28px 24px; }
    .section-card-title { font-size: 1rem; font-weight: 600; color: var(--primary); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    /* ── Announcement blocks ── */
    .asb-announce-block {
      background: var(--card); border-radius: var(--radius-sm);
      box-shadow: var(--shadow); overflow: hidden; margin-bottom: 12px;
    }
    .asb-announce-block:last-child { margin-bottom: 0; }
    .asb-announce-block-header {
      background: var(--primary); color: #fff;
      padding: 10px 18px; font-size: .82rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .07em;
    }
    .asb-announce-block ul { list-style: none; padding: 0; margin: 0; }
    .asb-announce-block > ul > li {
      display: flex; gap: 12px; padding: 12px 18px;
      border-bottom: 1px solid var(--border); align-items: flex-start;
      cursor: pointer; user-select: none; transition: background .15s;
    }
    .asb-announce-block > ul > li:hover { background: var(--highlight); }
    .asb-announce-block > ul > li:last-child { border-bottom: none; }
    .asb-announce-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--primary); flex-shrink: 0; margin-top: 5px;
    }
    .asb-announce-main { font-size: .88rem; font-weight: 700; color: var(--text); display: block; line-height: 1.45; }
    .asb-announce-sub { list-style: none; padding: 5px 0 1px; margin: 0; display: none; flex-direction: column; gap: 3px; }
    .asb-announce-sub li { font-size: .8rem; color: var(--text-muted); padding-left: 14px; position: relative; line-height: 1.5; }
    .asb-announce-sub li::before { content: '—'; position: absolute; left: 0; color: var(--text-muted); font-weight: 600; }
    .asb-announce-block > ul > li.open .asb-announce-sub { display: flex; }
    .asb-announce-chevron {
      flex-shrink: 0; width: 20px; height: 20px; display: flex; align-items: center;
      justify-content: center; color: var(--text-muted); transition: transform .2s; margin-top: 2px;
    }
    .asb-announce-block > ul > li.open .asb-announce-chevron { transform: rotate(180deg); }

    /* ── Fundraiser list ── */
    .fundraiser-list { display: flex; flex-direction: column; gap: 14px; }
    .fundraiser-item { border-left: 3px solid var(--primary); padding: 12px 16px; background: var(--bg); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
    .fundraiser-date { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--primary); margin-bottom: 4px; }
    .fundraiser-title { font-size: .95rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .fundraiser-location { font-size: .78rem; color: var(--text-muted); margin-bottom: 6px; display: flex; align-items: center; gap: 4px; }
    .fundraiser-desc { font-size: .82rem; color: #475569; line-height: 1.5; }

    /* ── Instagram ── */
    .instagram-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #833ab4 0%, #fd1d1d 50%, #fcb045 100%);
      color: #fff; padding: 12px 24px; border-radius: var(--radius-sm);
      font-size: .9rem; font-weight: 600; text-decoration: none;
      transition: var(--transition);
    }
    .instagram-btn:hover { opacity: .9; transform: translateY(-1px); box-shadow: var(--shadow-md); }
    .tiktok-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: linear-gradient(135deg, #69C9D0 -20%, #010101 25%, #010101 75%, #EE1D52 120%);
      color: #fff; padding: 12px 24px; border-radius: var(--radius-sm);
      font-size: .9rem; font-weight: 600; text-decoration: none;
      transition: var(--transition);
    }
    .tiktok-btn:hover { opacity: .85; transform: translateY(-1px); box-shadow: var(--shadow-md); }

    /* ── Not found ── */
    .not-found { text-align: center; padding: 80px 24px; }
  </style>
</head>
